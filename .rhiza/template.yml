repository: "jebel-quant/rhiza"
ref: "v1.4.2"

profiles:
  - github-project

templates:
  - legal

# Files from the profiles above that this project deliberately does not want.
# Listed here so `rhiza sync` never restores them.
exclude:
  # Mutation testing is not used in this repository. The gate enforces a 100%
  # mutation score, which is unreachable here without suppressing equivalent
  # mutants, and the signal did not justify the upkeep.
  - .github/workflows/rhiza_mutation.yml

  # ClusterFuzzLite fuzzing was retired here: the .clusterfuzzlite/ config it
  # drives was deleted, and the reusable workflow needs both that directory and
  # an opt-in variable, so the stub could only ever skip. A workflow that exists
  # solely to no-op still costs a queued job on every PR and reads, in the Actions
  # tab, as coverage this repo does not have.
  - .github/workflows/rhiza_fuzzing.yml

  # This repo IS rhiza-hooks. The template's copy consumes the hooks through a
  # published `rev:`, which is correct for the ~26 downstream repos but wrong
  # here: at the moment a release is cut the pinned tag does not exist yet, so
  # a release PR could never go green, and the pin drifts on every release.
  # The local copy uses `repo: local` instead. Excluded so sync cannot restore
  # the remote self-reference. Cost: upstream improvements to the shared hook
  # list must be ported by hand. See #293.
  - .pre-commit-config.yaml

  # .rhiza/.env only ever set SOURCE_FOLDER=src and MARIMO_FOLDER=docs/notebooks,
  # which are exactly the `?=` defaults in .rhiza/rhiza.mk — so the file changed
  # nothing except making both values immune to an environment override. Removed;
  # rhiza.mk `-include`s it, so its absence is a supported state. Put a new one
  # back only to set a value that actually differs from the default.
  - .rhiza/.env

  # .rhiza/.gitignore existed solely to re-include .rhiza/.env against the root
  # .gitignore's `.env` rule. With .env gone it has no other rule to carry.
  - .rhiza/.gitignore

  # The three entries below are GitHub *repo metadata*, not build machinery: they
  # shape what a human sees when filing an issue, opening a discussion, or looking
  # up which secrets CI wants. rhiza-hooks is a pre-commit hook provider consumed by
  # the other rhiza repos, so its intake needs to ask about hook IDs, prek/uvx
  # invocation and the `rev:` a reporter pinned — questions the generic template
  # forms have no field for. Excluded so this repo owns the wording; the cost is
  # that upstream improvements to these forms must be ported by hand.
  - .github/CONFIG.md
  - .github/DISCUSSION_TEMPLATE
  - .github/ISSUE_TEMPLATE
