repository: "jebel-quant/rhiza"
ref: "v1.7.2"

profiles:
  - github-project

templates:
  - legal

# Files from the profiles above that this project deliberately does not want.
# Listed here so `rhiza sync` never restores them.
exclude:
  # This repo IS rhiza-hooks. The template's copy consumes the hooks through a
  # published `rev:`, which is correct for the ~26 downstream repos but wrong
  # here: at the moment a release is cut the pinned tag does not exist yet, so
  # a release PR could never go green, and the pin drifts on every release.
  # The local copy uses `repo: local` instead. Excluded so sync cannot restore
  # the remote self-reference. Cost: upstream improvements to the shared hook
  # list must be ported by hand. See #293.
  - .pre-commit-config.yaml

  # .github/CONFIG.md is GitHub *repo metadata*, not build machinery: it records which
  # secrets and variables CI wants. rhiza-hooks is a pre-commit hook provider consumed
  # by the other rhiza repos, so its wording is specific to that role. Excluded so this
  # repo owns it; the cost is that upstream improvements must be ported by hand.
  - .github/CONFIG.md

