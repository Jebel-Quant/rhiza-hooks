#
# Trigger: This workflow runs on pushes to the main branch.

name: "(RHIZA) BENCHMARK"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  benchmark:
    uses: jebel-quant/rhiza/.github/workflows/rhiza_benchmark.yml@ae79c6f0729b21239655abe390269be9171f907d # v0.18.8
    secrets: inherit
