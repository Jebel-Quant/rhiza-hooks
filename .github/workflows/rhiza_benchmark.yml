# Workflow: Benchmarks
#
# Purpose: Run the benchmark suite on pushes to main to create a measurable
#          performance baseline over time.
#
# Trigger: This workflow runs on pushes to the main branch.

name: "(RHIZA) BENCHMARK"

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  benchmark:
    uses: jebel-quant/rhiza/.github/workflows/rhiza_benchmark.yml@a1ed3dfa30b461413bfee24a784cff718f7b944f # v0.19.1
    secrets: inherit
