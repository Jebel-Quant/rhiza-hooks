# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Continuous Integration
#
# Purpose: Run tests on multiple Python versions, check dependencies, run
#          pre-commit hooks, verify documentation coverage, validate the
#          project, run security scans, and check license compliance.
#
# Trigger: On push and pull_request.

name: "(RHIZA) CI"

permissions:
  contents: read
  actions: read

on:
  push:
  pull_request:
  workflow_call:

jobs:
  lockfile-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.11.16"

      - name: Ensure uv.lock exists
        run: test -f uv.lock

      - name: Validate uv.lock TOML format
        run: python -c "import tomllib, pathlib; tomllib.loads(pathlib.Path('uv.lock').read_text())"

      - name: Ensure uv.lock is in sync
        run: uv lock --check

  ci:
    uses: jebel-quant/rhiza/.github/workflows/rhiza_ci.yml@a1ed3dfa30b461413bfee24a784cff718f7b944f # v0.19.1
    secrets: inherit
