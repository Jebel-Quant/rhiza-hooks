# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: OpenSSF Scorecard
#
# Purpose: Runs the OpenSSF Scorecard security analysis to provide an external,
#          quantified security grade and automatically catch gaps (e.g. unpinned
#          actions). Results are uploaded to GitHub's security dashboard (SARIF)
#          and published to the public Scorecard API so the README badge updates.
#
# Trigger: On push to main/master and weekly schedule.

name: "(RHIZA) SCORECARD"

permissions: read-all

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '27 1 * * 1'

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce28f5bb42b7a9f2c824e633a3f6ee835bab6858 # v3.29.0
        with:
          sarif_file: results.sarif
