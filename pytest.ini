[pytest]
testpaths = tests
# Enable live logs on console
log_cli = true
# Show DEBUG+ messages
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
# Show extra summary info for skipped/failed tests; enforce the coverage gate.
addopts =
    -ra
    --cov=rhiza_hooks
    --cov-report=term-missing
    --cov-fail-under=100
# Per-test timeout (requires pytest-timeout, see the test dependency group)
timeout = 60
# Treat warnings as errors so regressions surface in CI. The single ignore
# below is a known artifact of exercising `if __name__ == "__main__"` blocks
# via runpy.run_module for coverage; it is not a product warning.
filterwarnings =
    error
    ignore:.*found in sys\.modules.*:RuntimeWarning
