[pytest]
testpaths = tests
# Enable live logs on console
log_cli = true
# Show DEBUG+ messages
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
# Show extra summary info for skipped/failed tests. Coverage flags are supplied
# by the `make test` target (see COVERAGE_FAIL_UNDER), so they are intentionally
# not set here to avoid conflicting/duplicate --cov options.
addopts = -ra
# Per-test timeout (requires pytest-timeout, see the test dependency group)
timeout = 60
# Treat warnings as errors so regressions surface in CI. The ignores below are
# known third-party/test-harness artifacts, not product warnings:
#   1. runpy re-import when exercising `if __name__ == "__main__"` blocks.
#   2. pytest-benchmark auto-disabling itself under xdist (`make test` runs -n auto).
#   3. Non-deterministic unraisable exceptions from stdlib finalizers (e.g.
#      tempfile's _TemporaryFileCloser.__del__ when GC'ing a mocked HTTPError on
#      Python 3.14); raised at GC time, outside our code.
filterwarnings =
    error
    ignore:.*found in sys\.modules.*:RuntimeWarning
    ignore:Benchmarks are automatically disabled because xdist plugin is active
    ignore::pytest.PytestUnraisableExceptionWarning
