# Pre-commit hooks for rhiza projects
# These hooks are extracted from rhiza's local hooks for use as an external repository.
# See: https://github.com/Jebel-Quant/rhiza

##@ Migrated from Rhiza

- id: check-rhiza-workflow-names
  name: Check and Fix Rhiza workflow names
  description: Ensures GitHub Actions workflow names have the (RHIZA) prefix in uppercase
  entry: check-rhiza-workflow-names
  language: python
  files: ^\.github/workflows/rhiza_.*\.ya?ml$
  types: [yaml]

- id: update-readme-help
  name: Update README with Makefile help output
  description: Embeds the output of 'make help' into README.md
  entry: update-readme-help
  language: python
  files: ^Makefile$
  pass_filenames: false

##@ Additional Utility Hooks

- id: check-rhiza-config
  name: Check rhiza configuration
  description: Validates the .rhiza/template.yml configuration file
  entry: check-rhiza-config
  language: python
  files: ^\.rhiza/template\.yml$
  types: [yaml]

- id: check-makefile-targets
  name: Check Makefile targets
  description: Ensures required Makefile targets exist
  entry: check-makefile-targets
  language: python
  files: (^Makefile$|^\.rhiza/.*\.mk$)
  types: [makefile]

- id: check-python-version-consistency
  name: Check Python version consistency
  description: Ensures Python version is consistent across .python-version and pyproject.toml
  entry: check-python-version-consistency
  language: python
  files: (^\.python-version$|^pyproject\.toml$)
  pass_filenames: false
  always_run: true

- id: check-rust-version-consistency
  name: Check Rust version consistency
  description: Ensures the pinned Rust toolchain agrees with Cargo.toml's rust-version (MSRV)
  entry: check-rust-version-consistency
  language: python
  files: (^rust-toolchain$|^rust-toolchain\.toml$|^Cargo\.toml$)
  pass_filenames: false

- id: check-go-version-consistency
  name: Check Go version consistency
  description: Ensures .go-version agrees with the go and toolchain directives in go.mod
  entry: check-go-version-consistency
  language: python
  files: (^\.go-version$|^go\.mod$)
  pass_filenames: false

- id: check-bumpversion-config
  name: Check bump-my-version config is discoverable
  description: Ensures a bumpversion section exists where bump-my-version searches, and agrees with pyproject.toml
  entry: check-bumpversion-config
  files: (^pyproject\.toml$|^\.bumpversion\.(toml|cfg)$|^setup\.cfg$|^\.rhiza/\.cfg\.toml$)
  language: python
  pass_filenames: false

- id: check-template-bundles
  name: Check template bundles configuration
  description: Validates templates against remote template-bundles.yml from template repository
  entry: check-template-bundles
  language: python
  files: ^\.rhiza/template\.yml$
  types: [yaml]

##@ Template-ownership and CI-consistency hooks

# No `files:` pattern: any staged file may be a template-owned one, and
# pass_filenames hands this hook exactly the staged paths to test.
- id: check-managed-files
  name: Check no template-owned file is modified
  description: Refuses edits to files listed in .rhiza/template.lock, which the next sync overwrites
  entry: check-managed-files
  language: python

- id: check-workflow-make-targets
  name: Check make targets invoked by CI exist
  # Quoted for the `uses:` colon, and narrowed deliberately: only the inline shell steps
  # of a CI file are read, so a job that delegates to a reusable workflow contributes
  # nothing. --require-invocations turns that silence into a failure where it is unexpected.
  description: "Ensures every make target invoked by an inline CI shell step is defined in the Makefile or its includes; a reusable workflow (`uses:`) is not followed"
  entry: check-workflow-make-targets
  language: python
  files: (^\.github/workflows/.*\.ya?ml$|^\.gitlab-ci\.yml$|^Makefile$|^\.rhiza/.*\.mk$)
  pass_filenames: false

- id: check-license-metadata
  name: Check license metadata is coherent
  # Quoted: an unquoted "License:: " would end the scalar at the colon-space.
  description: "Rejects a PEP 639 license expression declared alongside a License:: trove classifier"
  entry: check-license-metadata
  language: python
  files: ^pyproject\.toml$
  pass_filenames: false

# pass_filenames is false because parity is a property of the whole tree: the orphan
# direction has to see every test file, not just the staged ones. `files:` still gates
# *when* it runs, so an unrelated commit does not pay for the walk.
- id: check-test-layout
  name: Check tests mirror sources 1:1 (files + Test classes)
  description: Ensures every source module has a mirrored test module and every class a Test class, in both directions
  entry: check-test-layout
  language: python
  files: \.py$
  pass_filenames: false
