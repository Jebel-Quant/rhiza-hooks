# Originally from the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza), but NO LONGER SYNCED — this file is
# listed under `exclude:` in .rhiza/template.yml because the template's copy
# consumes rhiza-hooks through a published `rev:`, which this repo cannot use
# on itself. It is now locally owned: upstream changes to the shared hook list
# must be ported by hand. See #293.
#
# Pin node so pre-commit provisions a compatible runtime instead of using the
# system node. Some npm-based hooks (markdownlint-cli) pull transitive deps that
# reject odd-numbered current node releases (e.g. v25), failing on EBADENGINE.
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^recipe/meta\.yaml$

  - repo: local
    hooks:
      - id: no-python-cache-files
        name: Prevent committing Python cache files
        language: fail
        entry: Python cache files (__pycache__, .pyc, .pyo, .pyd) must not be committed. Run 'make clean' to remove them.
        files: '(/__pycache__/|\.py[cod]$)'

      - id: no-rej-files
        name: Reject .rej files
        entry: "bash -c 'find . -type f -name \"*.rej\" | grep -q . && { echo \"ERROR: .rej files detected\"; find . -type f -name \"*.rej\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.0'
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --unsafe-fixes ]

      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["--ini", ".bandit", "--exclude", ".venv,tests,.rhiza/tests,.git,.pytest_cache"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.sh$'

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.7.2
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      - id: uv-lock

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        files: ^src/

  # This repo IS rhiza-hooks, so it must not consume its own hooks through a
  # published `rev:` — that pin would reference a tag which, at the moment a
  # release is cut, does not exist yet, making any release PR unmergeable. It
  # also silently goes stale on every release (it sat at v0.7.0 through v0.8.0).
  #
  # `repo: local` is the pre-commit analogue of `uses: ./.github/actions/...`:
  # no rev, nothing to bump, and the hooks run against the working tree rather
  # than the last release — which is what dogfooding is supposed to mean.
  #
  # Entries go through scripts/run_hook.sh, which locates uv the way the rhiza
  # Makefile does (PATH, then ./bin) — a bare `uv run` entry fails in CI, where
  # uv is installed into ./bin and never put on PATH. That script's header
  # records why `language: python` cannot be used here instead.
  #
  # Entries mirror `.pre-commit-hooks.yaml`; keep the two in step. See #293.
  - repo: local
    hooks:
      # Migrated from rhiza
      - id: check-rhiza-workflow-names
        name: Check and Fix Rhiza workflow names
        entry: scripts/run_hook.sh check-rhiza-workflow-names
        language: script
        files: ^\.github/workflows/rhiza_.*\.ya?ml$
        types: [yaml]

      - id: update-readme-help
        name: Update README with Makefile help output
        entry: scripts/run_hook.sh update-readme-help
        language: script
        files: ^Makefile$
        pass_filenames: false

      # Additional utility hooks
      - id: check-rhiza-config
        name: Check rhiza configuration
        entry: scripts/run_hook.sh check-rhiza-config
        language: script
        files: ^\.rhiza/template\.yml$
        types: [yaml]

      - id: check-makefile-targets
        name: Check Makefile targets
        entry: scripts/run_hook.sh check-makefile-targets
        language: script
        files: (^Makefile$|^\.rhiza/.*\.mk$)
        types: [makefile]

      - id: check-python-version-consistency
        name: Check Python version consistency
        entry: scripts/run_hook.sh check-python-version-consistency
        language: script
        files: (^\.python-version$|^pyproject\.toml$)
        pass_filenames: false
        always_run: true

      - id: check-rust-version-consistency
        name: Check Rust version consistency
        entry: scripts/run_hook.sh check-rust-version-consistency
        language: script
        files: (^rust-toolchain$|^rust-toolchain\.toml$|^Cargo\.toml$)
        pass_filenames: false

      - id: check-go-version-consistency
        name: Check Go version consistency
        entry: scripts/run_hook.sh check-go-version-consistency
        language: script
        files: (^\.go-version$|^go\.mod$)
        pass_filenames: false

      - id: check-bumpversion-config
        name: Check bump-my-version config is discoverable
        entry: scripts/run_hook.sh check-bumpversion-config
        language: script
        files: (^pyproject\.toml$|^\.bumpversion\.(toml|cfg)$|^setup\.cfg$|^\.rhiza/\.cfg\.toml$)
        pass_filenames: false

      - id: check-template-bundles
        name: Check template bundles configuration
        # --offline skips the network fetch so commits work offline and are not
        # coupled to the template repo's availability; drop it to validate the
        # configured templates against the remote template-bundles.yml.
        entry: scripts/run_hook.sh check-template-bundles --offline
        language: script
        files: ^\.rhiza/template\.yml$
        types: [yaml]

      # Template-ownership and CI-consistency hooks
      # No `files:` pattern: any staged file may be a template-owned one, and
      # pass_filenames hands the hook exactly the staged paths to test. Bypass a
      # deliberate sync commit with `SKIP=check-managed-files git commit`.
      - id: check-managed-files
        name: Check no template-owned file is modified
        entry: scripts/run_hook.sh check-managed-files
        language: script

      - id: check-workflow-make-targets
        name: Check make targets invoked by CI exist
        entry: scripts/run_hook.sh check-workflow-make-targets
        language: script
        files: (^\.github/workflows/.*\.ya?ml$|^\.gitlab-ci\.yml$|^Makefile$|^\.rhiza/.*\.mk$)
        pass_filenames: false

      - id: check-license-metadata
        name: Check license metadata is coherent
        entry: scripts/run_hook.sh check-license-metadata
        language: script
        files: ^pyproject\.toml$
        pass_filenames: false

      # Dogfooded like the rest, though this repo renders nothing: it has no
      # pre-commit/ directory, so the hook reports "nothing to render" and passes.
      # That is precisely the case worth exercising here — it is what every consumer
      # that adopts the hook without adopting fragments will hit.
      - id: check-precommit-render
        name: Check rendered pre-commit configs
        entry: scripts/run_hook.sh render-precommit
        language: script
        files: (^pre-commit/.*\.ya?ml$|(^|/)\.pre-commit-config\.yaml$)
        pass_filenames: false
