[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Supplies the `version` that [project] declares dynamic, from `git describe`. Two
# consequences worth knowing:
#   * The build needs the tag to be visible. hatch-vcs does not fail without it -- it
#     falls back to a dev version like 1.3.1.dev3+g<sha> -- so rhiza_release.yml checks
#     the built distribution's filename against the tag, and its checkout uses
#     fetch-depth: 0. An sdist carries the resolved number in PKG-INFO, so building from
#     one needs no git.
#   * Between tags the local version is the *next* patch as a dev release
#     (guess-next-dev, the default), which is why nothing pins a fallback-version here:
#     a wrong-looking version must surface as a release failure, not as a plausible
#     constant.
[tool.hatch.version]
source = "vcs"

[project]
name = "rhiza-hooks"
# Derived from the git tag by hatch-vcs (see [tool.hatch.version]) rather than written
# here, so the tag is the single source of truth and a release is `git tag` alone -- no
# bump commit, and no way for a number in this file to disagree with what was tagged.
dynamic = ["version"]
description = "Pre-commit hooks for rhiza projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Harry Campion" },
    { name = "Thomas Schmelzer" }
]
classifiers = [
    # Deliberate PyPI kill-switch (issue #121): this package is intentionally NOT
    # published to PyPI. The release pipeline (GitHub release, SBOM, CHANGELOG) still
    # runs on tags, but rhiza_release.yml skips the PyPI publish step whenever this
    # classifier is present. Remove it ONLY if you intend to publish to PyPI, and only
    # after registering the project as a PyPI Trusted Publisher.
    "Private :: Do Not Upload",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # The Python version trove classifiers below are the single source of truth for
    # the CI test matrix (issue #119): `make version-matrix` (rhiza-tools) reads them
    # from this file, and the upstream rhiza_ci.yml reusable workflow tests every
    # listed version across ubuntu/macos/windows. Keep them in sync with what is
    # actually supported — adding/removing one changes CI coverage automatically.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0.1"
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/rhiza-hooks"
Repository = "https://github.com/Jebel-Quant/rhiza-hooks"

[project.scripts]
# Migrated from rhiza
check-rhiza-workflow-names = "rhiza_hooks.check_workflow_names:main"
update-readme-help = "rhiza_hooks.update_readme_help:main"
check-rhiza-config = "rhiza_hooks.check_rhiza_config:main"
check-makefile-targets = "rhiza_hooks.check_makefile_targets:main"
check-python-version-consistency = "rhiza_hooks.check_python_version:main"
check-rust-version-consistency = "rhiza_hooks.check_rust_version:main"
check-go-version-consistency = "rhiza_hooks.check_go_version:main"
check-bumpversion-config = "rhiza_hooks.check_bumpversion_config:main"
check-template-bundles = "rhiza_hooks.check_template_bundles:main"
check-managed-files = "rhiza_hooks.check_managed_files:main"
check-workflow-make-targets = "rhiza_hooks.check_workflow_make_targets:main"
check-license-metadata = "rhiza_hooks.check_license_metadata:main"
check-test-layout = "rhiza_hooks.check_test_layout:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_hooks"]

[tool.deptry]
extend_exclude = ["book"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "hypothesis>=6.165.9",
]
# mypy, ruff, interrogate and pre-commit are deliberately absent: nothing resolves the
# *tools* from the project environment. ruff and the hook suite run through uvx (`fmt` in
# the root Makefile via prek, and .rhiza/make.d/quality.mk), mypy through
# `uv run --with mypy` and interrogate through `uv run --with interrogate` in
# .rhiza/make.d/test.mk — each provisions its own ephemeral environment. Declaring them
# here only pinned a second, unused copy in uv.lock for renovate to bump.
#
# types-pyyaml is the exception and must stay, because it is not a tool: stubs are input
# to the analysis, so they have to be present in the environment mypy *inspects*, not the
# one it runs from. `uv run --with mypy` supplies only mypy, so dropping the stubs made
# `make typecheck` fail under --strict with "Library stubs not installed for yaml" on
# every module importing yaml. It passed locally anyway — `make install` syncs with
# --inexact, which never prunes, so an already-installed copy lingered in .venv after it
# left uv.lock. Clean checkouts (i.e. CI) had no such copy. Moving this to a
# `--with types-pyyaml` in test.mk would suit the rule above better, but that file is
# Rhiza-managed, so it needs an upstream change first.
#
# Named `types`, not `lint`, on purpose. Rhiza retired the `lint` group upstream
# (jebel-quant/rhiza#1484): prek/uvx provision every linter, so the group had nothing
# legitimate to hold, the shipped `test_lint_group_present` check is gone, and
# .rhiza/CONTRIBUTING.md now states outright that no such group exists. Reusing the name
# for a stubs-only group would read as that retired convention still being alive. The
# name is otherwise inert — UV_SYNC_ARGS in .rhiza/make.d/python.mk is `--all-groups`,
# so nothing selects this group by name.
types = [
    "types-pyyaml>=6.0.12.20260815",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

# Configuration for this repo's own `check-test-layout` hook (src/rhiza_hooks/
# check_test_layout.py), which is dogfooded through the `repo: local` block in
# .pre-commit-config.yaml. The table name is the hook's published contract, so it is
# the same key a downstream consumer writes.
[tool.check_test_layout]
# tests/meta/ holds meta-tests for repository *metadata* — the pre-commit manifest, the
# docs nav, encoding hygiene — rather than for a src/ module. They have no counterpart to
# mirror, so exempt the subtree from the reverse (orphan) check while keeping forward
# parity enforced for every source module.
exempt_dirs = ["meta"]

# tests/test_rhiza_packaging.py is delivered by Rhiza's python-core bundle (it arrived
# with the v1.3.2 sync) and asserts that [project].version matches the version actually
# installed into the environment. It covers packaging, not a src/ module, so the reverse
# check reads it as an orphan looking for src/rhiza_packaging.py. It is a synced,
# template-owned file: deleting it would be undone by the next sync, and excluding it in
# .rhiza/template.yml would drop a real invariant, so exempt it here instead.
exempt_files = ["test_rhiza_packaging.py"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0.
# `.rhiza/rhiza.mk` and the ten fragments under `.rhiza/make.d/` are gone; the root
# Makefile is a 71-line template-owned shim whose catch-all rule forwards every target to
# the pinned CLI, so each target CLAUDE.md and the README document still works. Its
# `RHIZA_TASK ?= rhiza-task@1.7.0` pin travels with the sync and is not edited here. This
# table is unaffected: settings were never in the Makefile.
#
# Read as layer 3 of rhiza-task's resolution order (defaults -> .rhiza/.env ->
# pyproject.toml -> RHIZA_* environment). There is no `.rhiza/.env` here -- the template
# stopped shipping one, and the `exclude:` entry that used to suppress it was pruned in
# #378 as dead -- so this table is the only place an override can live. Only entries that
# differ from the CLI's defaults belong here; `uvx rhiza-task print <setting>` shows
# what one resolves to.

# CLAUDE.md and [tool.coverage.report] below both document 100% as a hard invariant.
# The retired python.mk had `COVERAGE_FAIL_UNDER ?= 90` and the old root Makefile
# raised it to 100 above the include. The `test` task passes --cov-fail-under on the
# command line, which outranks the `fail_under = 100` in [tool.coverage.report], so
# leaving this at the CLI default of 90 would quietly weaken the gate while the config
# file still claimed 100. Keep the two in step.
coverage-fail-under = 100

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone, so a
# bare migration would have dropped `mypy --strict` -- which [tool.mypy] configures and
# CLAUDE.md relies on for the `types` group's whole justification (types-pyyaml is only
# there because mypy --strict fails without it). `both` is also stricter here than it was
# under make: the shell `case` let mypy's exit status win, so a ty failure could pass,
# where the CLI raises on each run.
typechecker = "both"

# The conformance checks CLAUDE.md's "The rhiza checks are a dependency, not a directory"
# section describes, still provisioned on the fly, so there is nothing to add to
# [dependency-groups]. The CLI's own default is v0.2.0, behind this pin, so leaving the
# key unset would *downgrade* the checks -- the drift the pin exists to prevent.
#
# 0.6.0 is required by this repo's dynamic [project].version, not merely available: it is
# the first release whose test_pyproject accepts a version derived from the VCS. Under
# 0.2.1 three of its assertions read `[project].version` as the empty string and fail --
# the required-field check, the semver shape, and the tag-agreement one -- because they
# predate `dynamic = ["version"]` being a thing a rhiza project could do. 0.6.0 skips each
# with a reason instead, six skips in all. jquantstats, which made this move first, pins
# the same version.
#
# This also swaps the git ref this repo used for the released wheel on PyPI, which is
# what the rest of the fleet pins. Same code at the same tag, resolved without a clone.
#
# All four overrides in this table were re-checked against the rhiza-task 1.7.0 defaults
# (coverage_fail_under 90, typechecker "ty", mkdocs_extra_packages without `.`,
# pytest_rhiza at the v0.2.0 git ref) and each still differs from them.
pytest-rhiza = "pytest-rhiza==0.6.0"

# The old root Makefile carried
# `MKDOCS_EXTRA_PACKAGES = --with 'mkdocstrings[python]' --with .`.
# rhiza-task has made mkdocstrings[python] the default since 0.3.1, so only the second
# half is a real override -- and it is load-bearing: `book` builds the site through
# `uvx zensical`, an isolated environment that does not contain this project, and the
# ~20 pages under docs/api-reference/ are nothing but `::: rhiza_hooks.*` autodoc blocks.
# Without `.` mkdocstrings cannot import the package and every one of them renders empty.
# `.` resolves against the repo root because the task runs uvx with cwd there.
mkdocs-extra-packages = ["mkdocstrings[python]", "."]

# Not set, on purpose:
#   source-folder / tests-folder -- the defaults `src` and `tests` are this repo's layout.
#   marimo-folder      -- the default `docs/notebooks` is what the retired `.rhiza/.env`
#       used to set, so the default already matches.
#   layers             -- `python` is detected from pyproject.toml, and there is no second
#       language layer for the inference to get wrong.
#   uv-sync-args       -- `--all-extras --all-groups` is both the CLI default and what the
#       retired python.mk used, which is why the `types` group needs nothing to be selected.

# Version bumping. This block must live here: bump-my-version only searches
# .bumpversion.toml, pyproject.toml, setup.cfg and .bumpversion.cfg. Without a
# table in one of those the tool does not error — it falls back to `git describe`
# and computes bumps off the last reachable tag rather than the version above,
# which silently offers a version that has already been published.
#
# The block used to live in .rhiza/.cfg.toml, where it was inert for exactly that
# reason. Rhiza v1.3.0 deleted that file and now enforces the rule from the other
# side: pytest_rhiza.checks.test_pyproject::TestBumpversionConfigIsDiscoverable fails
# if no discoverable config declares one. (v1.3.4 then moved that check out of
# .rhiza/tests/ and into the installed pytest-rhiza package pinned above.)
#
# Deliberately no `current_version` and no [[tool.bumpversion.files]] entry for the
# project version: `[project].version` is dynamic, derived from the git tag by
# hatch-vcs, so no file carries a number for a bump to rewrite. bump-my-version
# resolves the current version from the newest reachable tag instead — the
# `git describe` fallback this comment's opening warns about, which with the tag as
# the single source of truth is now the right answer rather than the trap. Adding
# either one back would break rather than duplicate: a stale `current_version` drifts
# silently, and a `search` pattern that occurs zero times is an error.
#
# A [[files]] entry IS still needed for any *additional* location that must carry the
# number literally — the README `rev:` pin below is exactly that — anchored to a
# prefix, since search/replace applies to every match in the file.
#
# /release drives the commit and tag itself, hence commit/tag = false.
[tool.bumpversion]
allow_dirty = false
commit = false
tag = false

# The README's Quick Start tells downstream projects which `rev:` to pin. It is a
# *second* copy of the version, so it needs an explicit entry — otherwise it keeps
# whatever release it was written against and every install snippet we publish is
# one release stale (it drifted to v0.7.0 while v0.7.1 was out). The search anchors
# on the `rev:` prefix, which occurs exactly once in the file; a bare version string
# would also rewrite unrelated matches.
[[tool.bumpversion.files]]
filename = "README.md"
search = "rev: v{current_version}"
replace = "rev: v{new_version}"
